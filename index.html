<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#dfeae6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#061315" media="(prefers-color-scheme: dark)">
  <title>Amigo Secreto Tropical</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fundo: bolhas de cor que sobem e descem, como luminária de lava -->
  <div class="animated-bg" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>
    <div class="orb orb-6"></div>
  </div>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo glass">
        <svg class="icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M14 27a10 10 0 0 1 20 0"/>
          <path d="M24 9v4M11.3 14.3l2.8 2.8M36.7 14.3l-2.8 2.8M6 27h3M39 27h3"/>
          <path d="M7 33c4.25 0 4.25 3 8.5 3s4.25-3 8.5-3 4.25 3 8.5 3 4.25-3 8.5-3"/>
          <path d="M13 40c3.67 0 3.67 2.5 7.33 2.5S24 40 27.67 40s3.66 2.5 7.33 2.5"/>
        </svg>
      </div>
      <p class="eyebrow">Edição Tropical</p>
      <h1>Amigo Secreto</h1>
      <p class="tagline">Sorteio na brisa do mar</p>
    </header>

    <!-- Painel principal de vidro -->
    <main class="card glass">
      <!-- Login Screen -->
      <div id="login-screen" class="screen">
        <div class="login-content">
          <h2>Área secreta</h2>
          <p class="subtitle">Digite sua senha para descobrir quem você tirou.</p>

          <div class="form-group">
            <div class="input-wrapper">
              <svg class="icon input-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/>
                <path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>
              </svg>
              <input
                type="password"
                id="password-input"
                placeholder="Sua senha"
                aria-label="Senha"
                autocomplete="off"
              >
            </div>
            <p id="error-message" class="error-message" role="alert"></p>
            <button type="button" id="login-btn" class="btn-primary">
              <span>Revelar meu amigo</span>
              <svg class="icon btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Reveal Screen -->
      <div id="reveal-screen" class="screen hidden">
        <div class="reveal-content">
          <p class="welcome-badge">Olá, <strong id="user-name"></strong></p>
          <h2>Seu amigo secreto</h2>
          <p class="reveal-subtitle">Toque no cartão para descobrir.</p>

          <div id="flip-card" class="flip-card">
            <div class="flip-card-inner">
              <!-- Front -->
              <div class="flip-card-front">
                <svg class="icon gift-icon" viewBox="0 0 48 48" aria-hidden="true">
                  <rect x="9" y="22" width="30" height="18" rx="2"/>
                  <rect x="6" y="15" width="36" height="7" rx="2"/>
                  <path d="M24 15v25"/>
                  <path d="M24 15c-2-6-10-8-10-3 0 3 5 3 10 3zM24 15c2-6 10-8 10-3 0 3-5 3-10 3z"/>
                </svg>
                <p class="flip-text">Toque para revelar</p>
              </div>
              <!-- Back -->
              <div class="flip-card-back">
                <p class="result-label">Você tirou</p>
                <p id="secret-friend" class="secret-friend"></p>
                <span class="result-rule" aria-hidden="true"></span>
                <p class="result-message">Capriche no presente.</p>
                <p class="hide-hint">Toque para esconder</p>
              </div>
            </div>
          </div>

          <button type="button" id="logout-btn" class="btn-secondary">
            <svg class="icon btn-back-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 12H5M11 6l-6 6 6 6"/>
            </svg>
            Sair da conta
          </button>
        </div>
      </div>
    </main>

    <footer>
      <p>Feito por <strong>Bruno Reis</strong></p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
